{% extends 'base.html' %}

{% block title %}Форма договора{% endblock %}

{% block content %}
    <h2>{% if contract %}Редактировать договор{% else %}Добавить договор{% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        <label for="client_id">Клиент:</label>
        <select name="client_id" id="client_id" required>
            {% for client in clients %}
                <option value="{{ client.pk }}" {% if contract.client.pk == client.pk %}selected{% endif %}>{{ client.full_name }}</option>
            {% endfor %}
        </select>
        
        <label for="car_id">Автомобиль:</label>
        <select name="car_id" id="car_id" required>
            {% for car in cars %}
                <option value="{{ car.pk }}" {% if contract.car.pk == car.pk %}selected{% endif %}>{{ car.brand }} {{ car.model }}</option>
            {% endfor %}
        </select>
        
        <label for="date">Дата:</label>
        <input type="date" name="date" id="date" value="{{ contract.date|default:'' }}" required>
        
        <label for="status">Статус:</label>
        <input type="text" name="status" placeholder="Укажите текущий статус" value="{{ contract.status|default:'' }}" required>
        
        <label for="total_amount">Сумма:</label>
        <input type="number" name="total_amount" placeholder="Введите сумму" value="{{ contract.total_amount|default:'' }}" required>
        
        <button type="submit">{% if contract %}Сохранить{% else %}Добавить{% endif %}</button>
    </form>
    <a href="{% url 'contract_list' %}">Назад к списку договоров</a>
{% endblock %}
