{% extends 'base.html' %}

{% block title %}Список заказов{% endblock %}

{% block content %}
    <h2>Список заказов</h2>
    <a href="{% url 'add_order' %}">
        <button type="button" class="btn btn-danger">Добавить заказ</button>
    </a>
    <table>
        <thead>
            <tr>
                <th>Клиент</th>
                <th>Услуга</th>
                <th>Дата заказа</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody>
            {% for order in orders %}
                <tr>
                    <td>{{ order.client.full_name }}</td>
                    <td>{{ order.service.name }}</td>
                    <td>{{ order.order_date }}</td>
                    <td>
                        <a href="{% url 'edit_order' order.pk %}">
                            <button type="button" class="btn btn-danger">Редактировать</button>
                        </a>
                        <form action="{% url 'delete_order' order.pk %}" method="post" style="display:inline;">
                            {% csrf_token %}
                            <button type="submit">Удалить</button>
                        </form>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
